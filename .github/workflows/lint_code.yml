name: lint code

on: [push, pull_request]

jobs:
  luacheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: lunarmodules/luacheck@v1
        with:
          args: >-
            . --std luajit --max-line-length 150 --no-config
            --globals vim Snacks

  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: v0.12.4
      - name: Install plugins
        run: |
          mkdir -p "$HOME/.config"
          ln -s "$GITHUB_WORKSPACE" "$HOME/.config/nvim"
          nvim --headless "+Lazy! install" +qa
      - name: Start Neovim
        run: |
          nvim --headless "+lua assert(vim.fn.has('nvim-0.12.4') == 1)" +qa
